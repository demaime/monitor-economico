name: Actualizar datos INDEC

on:
  schedule:
    # Cada 5 días (1, 6, 11, 16, 21, 26, 31) a las 15:00 UTC. El INDEC publica
    # el IPC a mitad de mes pero la fecha exacta varía; correr seguido no tiene
    # costo porque solo se comitea si los datos cambiaron.
    - cron: "0 15 */5 * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 trae npm 11, la misma major que generó package-lock.json.
          # Con npm 10 (Node 20) `npm ci` falla porque resuelve las peerDependencies
          # opcionales (yaml, de postcss-load-config) que el lock no incluye.
          node-version: 24

      - run: npm ci

      - name: Regenerar datos automáticos
        run: node scripts/actualizar-datos.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/auto
          if git diff --cached --quiet; then
            echo "Sin cambios este mes."
          else
            git commit -m "chore: actualización mensual de datos INDEC"
            git push
          fi
