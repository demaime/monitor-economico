name: Actualizar datos INDEC

on:
  schedule:
    # Día 18 de cada mes a las 15:00 UTC (después de la publicación del IPC,
    # que sale a mitad de mes). Si el INDEC todavía no publicó, el commit no
    # cambia nada y no pasa nada.
    - cron: "0 15 18 * *"
  workflow_dispatch:

jobs:
  actualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Regenerar datos automáticos
        run: node scripts/actualizar-datos.mjs

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/auto
          if git diff --cached --quiet; then
            echo "Sin cambios este mes."
          else
            git commit -m "chore: actualización mensual de datos INDEC"
            git push
          fi
